<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Lab Report Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1b2a24;--mu:#5d6b64;--ac:#0b7a4b;--ac2:#fff;--bd:#d9ded9;--wr:#b3261e}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111815;--card:#1a2420;--tx:#e8efe9;--mu:#9baba2;--ac:#3ecf8e;--ac2:#06150e;--bd:#2c3a34;--wr:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:880px;margin:0 auto;padding:14px}header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0}
.cover{height:170px;border-radius:14px;background:linear-gradient(135deg,var(--ac),#145c8a) center/cover;display:flex;align-items:flex-end;padding:16px;color:#fff;font-size:24px;font-weight:700;text-shadow:0 1px 4px #0008}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
input,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 8px}textarea{min-height:90px;font:13px ui-monospace,monospace}
button{background:var(--ac);color:var(--ac2);border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--wr)}
.mu{color:var(--mu);font-size:13px}.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--bd)}.ok{background:var(--ac);color:var(--ac2)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
pre{white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:8px;border:1px solid var(--bd)}.tabs{display:flex;gap:6px;flex-wrap:wrap}.n{font-size:26px;font-weight:700}.er{color:var(--wr)}
</style></head><body><div class="w" id="app"></div>
<script>
const $=id=>document.getElementById(id),val=id=>$(id).value.trim(),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let T=localStorage.getItem('st'),A=sessionStorage.getItem('at'),v=location.hash==='#admin'?'admin':'home',pub={},me=null,ct=null,rep='',st='',tab='Overview',ad=null,ex=null,timer=null,cx=null,dm=false,phOk={},fp=0,fe='',curS='chemistry',ST=[],acts=[],sk=0;
async function api(p,body,tk){const r=await fetch(p,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(tk?{Authorization:'Bearer '+tk}:{})},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok){const e=Error(j.error||'Error '+r.status);e.code=r.status;throw e}return j}
const fd=ms=>new Date(ms).toLocaleDateString(),dl=ms=>Math.ceil((ms-Date.now())/864e5),cap=s=>s[0].toUpperCase()+s.slice(1),sub=['chemistry','physics'];
const run=async f=>{try{await f()}catch(e){if(e.code===401){v==='admin'?(A=null,sessionStorage.removeItem('at')):(T=null,localStorage.removeItem('st'));v=v==='admin'?'admin':'home'}else alert(e.message)}R()};
async function go0(x){clearInterval(timer);v=x;rep='';st='';await run(async()=>{if(x==='portal'||x==='storage'||x==='activity'||x.startsWith('s:')){me=await api('/api/me',0,T);sk=me.now-Date.now()}if(x==='storage')ST=await api('/api/me/storage',0,T);if(x==='activity')acts=await api('/api/me/activity',0,T);if(x.startsWith('s:')){const k=x.slice(2);ct=me.subs[k].active?await api(`/api/subject/${k}/content`,0,T):null}if(x==='admin'&&A){ad=await api('/api/admin/summary',0,A);ex=await api('/api/admin/extra',0,A)}})}
function R(){const a=$('app'),hd=`<header><b>${esc(pub.site||'')}</b><span>${v!=='admin'&&T?`<button class="s" onclick="go('portal')">My portal</button> <button class="s" onclick="out()">Log out</button>`:''}</span></header>`;
a.innerHTML=hd+DM()+(v==='admin'?(A&&ad?AD():AL()):!T||v==='home'&&!T?HM():v==='portal'?PT():v==='storage'?STO():v==='activity'?ACT():v.startsWith('s:')?SJ(v.slice(2)):HM())}
function HM(){return `<div class="cover" style="${pub.cover?`background-image:url(${pub.cover})`:''}">${esc(pub.site||'')}</div>${fp?FP():''}<div class="g"><div class="c"><h3>Create account</h3><input id="e1" type="email" placeholder="Email"><input id="p1" type="password" placeholder="Choose a password (6+ characters)"><button onclick="auth('/api/register','e1','p1')">Sign up</button></div><div class="c"><h3>Log in</h3><input id="e2" type="email" placeholder="Email"><input id="p2" type="password" placeholder="Password"><button onclick="auth('/api/login','e2','p2')">Log in</button><p class="mu"><a href="#" onclick="fp=1;R();return false" style="color:inherit">Forgot password?</a></p></div></div><div class="c mu">Help desk: ${esc(pub.helpEmail||'')}</div>`}
function auth(u,e,p){run(async()=>{const j=await api(u,{email:val(e),password:$(p).value});T=j.token;localStorage.setItem('st',T);await go('portal')})}
function out(){T=null;localStorage.removeItem('st');v='home';R()}
function PT(){const av=me.photo?`<img src="${me.photo}" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover">`:`<div style="width:64px;height:64px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:26px">${esc(me.email[0].toUpperCase())}</div>`;
return `<div style="display:flex;gap:12px;align-items:center">${av}<div><h2 style="margin:0">Your portal</h2><div class="mu">${esc(me.email)}</div></div></div>${me.free?'<div class="c"><b>Access is free right now.</b> No subscription is needed.</div>':''}
<h3>My subscriptions</h3><div class="g">${sub.map(k=>{const s=me.subs[k];return `<div class="c"><h3>${cap(k)}</h3>${me.free?'<span class="b ok">Free access</span>':s.active?`<span class="b ok">Subscribed</span><div class="mu">Ends ${new Date(s.expires).toLocaleString()}</div><div class="cd" data-e="${s.expires}" style="font-size:20px;font-weight:700"></div>`:`<span class="b">Not subscribed</span><div class="mu">${s.expires?'Ended '+fd(s.expires)+'. ':''}KES ${s.price} for ${s.days} days</div>`}<p><button onclick="go('s:${k}')">Open subject</button></p></div>`}).join('')}</div>
<div class="tabs"><button class="s" onclick="go('storage')">My storage</button><button class="s" onclick="go('activity')">My activity</button></div>
<div class="c"><h3>Profile photo</h3><input type="file" id="pf" accept="image/*" onchange="upPhoto()">${me.photo?'<button class="s" onclick="rmPhoto()">Remove photo</button>':''}</div>
<div class="c"><h3>Security</h3><p class="mu">${me.hasPasskey?'✓ Your fingerprint or passkey is set up. You must confirm with it before changing your password or email.':'Set up your fingerprint or screen-lock passkey. It is required before you can change your password or email.'}</p><button class="s" onclick="pkAdd()">${me.hasPasskey?'Add another device':'Set up fingerprint / passkey'}</button>${me.hasPasskey?`<hr><input id="np" type="password" placeholder="New password (6+ characters)"><button class="s" onclick="chPw()">Change password</button><hr><input id="ne" type="email" placeholder="New email"><button class="s" onclick="chEm()">Request email change</button><div class="mu">Email changes also need the admin's approval.</div>`:''}</div>
<div class="c"><h3>Delete account</h3><p class="mu">This permanently deletes your account, your details and all your saved reports. Any subscription time left is lost with no refund. This cannot be undone.</p><button class="d" onclick="dm=true;R()">Delete my account</button></div><div class="c mu">Help desk: ${esc(pub.helpEmail||'')}</div>`}
function SJ0(k){const s=me.subs[k],back=`<button class="s" onclick="go('portal')">← Back</button>`;
if(!s.phone||!phOk[k])return back+`<div class="c"><h3>${cap(k)}: enter your phone number</h3><p class="mu">${s.expires?'Your subscription ended on '+fd(s.expires)+'. ':''}Enter the M-Pesa phone number you will pay with.</p><input id="ph" inputmode="tel" placeholder="Phone number e.g. 0712345678"><button onclick="run(async()=>{await api('/api/subject/${k}/login',{phone:val('ph')},T);phOk['${k}']=true;await go('s:${k}')})">Continue</button></div>`;
if(!s.active)return back+`<div class="c"><h3>${cap(k)}: subscribe</h3><p>Fee: <b>KES ${s.price}</b> for ${s.days} days.<br>M-Pesa phone: ${esc(s.phone)}</p>${st==='wait'?'<p><span class="b">Check your phone and enter your M-Pesa PIN…</span></p>':`<button onclick="pay('${k}')">Pay with M-Pesa</button>`}<p class="er">${esc(st==='failed'?'The payment was cancelled or failed. Try again.':st==='underpaid'?'The amount was less than the fee. Contact the help desk.':'')}</p></div>`;
const idf=ct.config.idf.split(',').map(x=>x.trim()).filter(Boolean),vs=ct.config.vars.split(',').map(x=>x.trim()).filter(Boolean);
return back+`<div class="c"><h3>${cap(k)}</h3><span class="b ok">Active</span> <span class="mu">Subscription ends ${fd(ct.expires)}</span></div><div class="c"><h3>Your details</h3>${idf.map((f,i)=>`<label class="mu">${esc(f)}</label><input id="i${i}" value="${esc(ct.identity[f]||'')}">`).join('')}<h3>Your measured values</h3>${vs.map((f,i)=>`<label class="mu">${esc(f)}</label><input id="v${i}" type="number" step="any">`).join('')}<button onclick="gen('${k}')">Generate report</button></div>${rep}`}
function pay(k){run(async()=>{const j=await api(`/api/subject/${k}/pay`,{},T);st='wait';R();timer=setInterval(async()=>{try{const p=await api('/api/pay/'+j.paymentId,0,T);if(p.status!=='pending'){clearInterval(timer);if(p.status==='paid')go('s:'+k);else{st=p.status;R()}}}catch(e){}},3000)})}
function gen(k){run(async()=>{const idf=ct.config.idf.split(',').map(x=>x.trim()).filter(Boolean),vs=ct.config.vars.split(',').map(x=>x.trim()).filter(Boolean),identity={},values={};idf.forEach((f,i)=>identity[f]=val('i'+i));vs.forEach((f,i)=>values[f]=val('v'+i));
const r=await api(`/api/subject/${k}/report`,{identity,values},T);rep=`<div class="c"><h3>Your report</h3><pre>${esc(r.text)}</pre><h3>Sources</h3><ul>${r.sources.map(x=>`<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></li>`).join('')}</ul><a href="${esc(r.youtube)}" target="_blank" rel="noopener">Suggested YouTube videos</a></div>`})}
function DM(){if(!dm)return '';const a=sub.filter(k=>me&&me.subs[k].active).map(cap);return `<div style="position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50"><div class="c" style="max-width:380px;width:100%;margin:0;max-height:90vh;overflow:auto"><h3>Delete your account?</h3><p class="mu">This will permanently delete:</p><ul class="mu"><li>your account and details</li><li>all your saved reports</li>${a.length?`<li><b>your active subscription (${a.join(', ')}), with no refund</b></li>`:''}</ul><p class="mu">This cannot be undone.</p><label class="mu">Type DELETE to confirm</label><input id="dc" autocomplete="off"><label class="mu">Your password</label><input id="dpw" type="password"><button class="d" onclick="delGo()">Delete forever</button> <button class="s" onclick="dm=false;R()">Cancel</button></div></div>`}
async function delGo(){if($('dc').value.trim()!=='DELETE')return alert('Type DELETE in capital letters to confirm');const pw=$('dpw').value;if(!pw)return alert('Enter your password');if(await runq(()=>api('/api/me/delete',{password:pw},T))){T=null;localStorage.removeItem('st');dm=false;v='home';R();alert('Your account has been deleted.')}}
/* chemistry: upload > check > generate > saved reports */
const DF=[['institution','Institution'],['name','Name'],['regNo','Reg No'],['topic','Topic'],['title','Title'],['task','Task'],['experimentName','Name of experiment'],['lecturer','Name of lecturer'],['experimentDate','Date of experiment'],['submissionDate','Date of submission']];
const UB=[['page1','Page 1 details','Photo of the details listed on page 1, or type them below'],['procedure','Your procedure','Upload your procedure (photo, PDF, Word) or type it'],['ra','Reagents and apparatus','Upload the list or type it'],['data','Your datasheet','Upload your datasheet exactly as your table is made'],['questions','Your questions','Upload the questions or type them']];
function SJ(k){if(!phOk[k])return PHF(k);return me.subs[k].active?CH(k):SJ0(k)+'<div class="c"><h3>My saved reports</h3><div id="reps" class="mu">Loading…</div></div>'}
async function go(x){cx=null;if(!x.startsWith('s:'))phOk={};await go0(x);if(x.startsWith('s:')&&me){curS=x.slice(2);loadReps();if(me.subs[curS].active)timer=setInterval(loadReps,5000)}}
function CH(k){const s=me.subs[k];return `<button class="s" onclick="go('portal')">← Back</button><div class="c"><h3>${cap(k)}</h3><span class="b ok">Active</span> <span class="mu">Subscription ends ${fd(s.expires)}</span></div><div class="c"><h3>My saved reports</h3><div id="reps" class="mu">Loading…</div></div>${me.instructions[k]?`<div class="c"><h3>Instructions for this subject</h3><div class="mu" style="white-space:pre-wrap">${esc(me.instructions[k])}</div></div>`:''}<div class="c"><h3>1. Upload your lab materials</h3><p class="mu">Photos, PDF, Word, Excel or typed text all work. Fill in what you have, then press Read.</p>${UB.map(([k,t,h])=>`<label><b>${t}</b></label><div class="mu">${h}</div><input type="file" id="f_${k}" accept="image/*,.pdf,.docx,.xlsx,.xls,.csv,.txt"><textarea id="t_${k}" style="min-height:50px" placeholder="Or type here"></textarea>`).join('')}<button onclick="readUp(this)">Read my uploads</button></div>${cx?REV():''}`}
function REV(){const d={...(ct.chem||{}),...Object.fromEntries(Object.entries(cx.details||{}).filter(([k,x])=>x))};return `<div class="c" id="rev"><h3>2. Check everything</h3><p class="mu">The website read your uploads. Correct anything that is wrong: your report is built from exactly what is below.</p><h3>Page 1 details</h3>${DF.map(([k,l])=>`<label class="mu">${l}</label><input id="d_${k}" value="${esc(d[k]||'')}">`).join('')}<label class="mu">Procedure</label><textarea id="r_proc" style="min-height:140px">${esc(cx.procedure||'')}</textarea><label class="mu">Reagents (one per line)</label><textarea id="r_rea">${esc((cx.reagents||[]).join('\n'))}</textarea><label class="mu">Apparatus (one per line)</label><textarea id="r_app">${esc((cx.apparatus||[]).join('\n'))}</textarea><label class="mu">Datasheet (first line = column headings, values separated by commas)</label><textarea id="r_csv" style="min-height:140px" oninput="prev()">${esc(cx.datasheetCsv||'')}</textarea><div class="sc" id="prev"></div><label class="mu">Questions (one per line)</label><textarea id="r_q">${esc((cx.questions||[]).join('\n'))}</textarea><button onclick="genRep(this)">Generate my report</button><p class="mu">Preparing a report takes a few minutes. It will appear under My saved reports.</p></div>`}
function prev(){const t=$('r_csv'),p=$('prev');if(!t||!p)return;p.innerHTML='<table>'+t.value.split('\n').filter(x=>x.trim()).map((r,i)=>'<tr>'+r.split(',').map(c=>i?`<td>${esc(c.trim())}</td>`:`<th>${esc(c.trim())}</th>`).join('')+'</tr>').join('')+'</table>'}
function shrink(f){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok({name:f.name,type:'image/jpeg',data:c.toDataURL('image/jpeg',.85).split(',')[1]})};i.onerror=()=>no(Error('Could not read that photo. Use a JPG or PNG.'));i.src=URL.createObjectURL(f)})}
async function fl(id){const f=$(id).files[0];if(!f)return null;if(f.size>8e6)throw Error('File too large (max 8 MB): '+f.name);if(f.type.startsWith('image/'))return shrink(f);return new Promise(r=>{const x=new FileReader();x.onload=()=>r({name:f.name,type:f.type,data:x.result.split(',')[1]});x.readAsDataURL(f)})}
async function runq(f){try{await f();return true}catch(e){if(e.code===401)run(async()=>{throw e});else alert(e.message);return false}}
async function readUp(b){b.disabled=true;b.textContent='Reading… (about a minute)';const ok=await runq(async()=>{const items={};for(const [k] of UB){const text=$('t_'+k).value.trim(),file=await fl('f_'+k);if(text||file)items[k]={text,file}}if(!Object.keys(items).length)throw Error('Upload or type something first');cx=await api('/api/chem/extract',{items,subject:curS},T)});if(ok){R();prev();loadReps();$('rev')?.scrollIntoView()}else{b.disabled=false;b.textContent='Read my uploads'}}
async function genRep(b){const L=id=>$(id).value.split('\n').map(x=>x.trim()).filter(Boolean),details={};DF.forEach(([k])=>details[k]=val('d_'+k));b.disabled=true;b.textContent='Starting…';const ok=await runq(()=>api('/api/chem/generate',{subject:curS,details,procedure:$('r_proc').value.trim(),reagents:L('r_rea'),apparatus:L('r_app'),datasheetCsv:$('r_csv').value.trim(),questions:L('r_q')},T));if(ok){cx=null;R();loadReps();alert('Your report is being prepared. It will appear under My saved reports in a few minutes.')}else{b.disabled=false;b.textContent='Generate my report'}}
async function loadReps(){const el=$('reps');if(!el)return;try{const r=await api('/api/reports/'+curS,0,T);el.innerHTML=r.length?`<div class="sc"><table><tr><th>Report<th>Date<th>Status<th></tr>${r.map(x=>`<tr><td>${esc(x.title||'Chemistry report')}<td>${new Date(x.created).toLocaleDateString()}<td>${x.status==='done'?'Ready':x.status==='working'?'Preparing…':'Failed: '+esc(x.error||'')}<td>${x.status==='done'?`<button class="s" onclick="dlr(${x.id})">Download</button>`:''}</tr>`).join('')}</table></div>`:'No reports yet.'}catch(e){}}
async function dlr(id){try{const r=await fetch('/api/report-file/'+id,{headers:{Authorization:'Bearer '+T}});if(!r.ok)throw Error('Download failed');const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='Chemistry-report-'+id+'.docx';a.click()}catch(e){alert(e.message)}}
function ACH(s,k){const c=k==='chemistry';return `<div class="c"><h3>${cap(k)}</h3><p class="mu">Fixed report layout: cover page, objectives, introduction, reagents and apparatus, procedure, data sheet, discussion, conclusions, calculations, references (APA 7th).${c?'':' Physics uses the same layout and the minimums set under Chemistry.'}</p><label class="mu">Price (KES)</label><input id="pr${k}" type="number" value="${s['price_'+k]}"><label class="mu">Duration (days)</label><input id="dy${k}" type="number" value="${s['days_'+k]}">${c?`<label class="mu">Minimum introduction length (words; about 450 per page)</label><input id="ciw" type="number" value="${s.chem_intro_words}"><label class="mu">Minimum references</label><input id="cmr" type="number" value="${s.chem_min_refs}"><label class="mu">Minimum objectives</label><input id="cmo" type="number" value="${s.chem_min_obj}">`:''}<label class="mu">Extra instructions for this subject (students see them, and the report writer follows them)</label><textarea id="xi${k}">${esc(s['extra_'+k]||'')}</textarea><button onclick="ssc('${k}')">Save ${cap(k)}</button></div>`}
function ssc(k){run(async()=>{const b={['price_'+k]:val('pr'+k),['days_'+k]:val('dy'+k),['extra_'+k]:$('xi'+k).value};if(k==='chemistry'){b.chem_intro_words=val('ciw');b.chem_min_refs=val('cmr');b.chem_min_obj=val('cmo')}await api('/api/admin/settings',b,A);alert('Saved');await go('admin')})}
function rpw(i){const u=ad.users[i],p=prompt('New temporary password for '+u.email+' (6 or more characters). Tell the student to change it after logging in:');if(!p)return;run(async()=>{await api('/api/admin/student/reset',{email:u.email,password:p},A);alert('Password changed for '+u.email)})}
function dst(i){const u=ad.users[i];if(!confirm('Delete the account of '+u.email+' and all their saved reports? This cannot be undone.'))return;run(async()=>
